name: Build and Deploy Docs 📚
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'site/**'
      - 'src/**'
      - 'README.md'
permissions:
  contents: write
jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install and Build 🔧
        run: |
          yarn
          yarn site:build:app
          yarn doc

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site-dist/app
