name: Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dbxScaleMed:
        description: "Run DBX scale MED scenario"
        required: false
        default: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Verify generated demo TypeInfo
        run: |
          yarn site:build:demo-types
          if ! git diff --exit-code -- site/common/DemoTypeInfoMap.json; then
            echo "Generated demo TypeInfoMap is out of date:"
            cat site/common/DemoTypeInfoMap.json
            exit 1
          fi

      - name: Build dist artifacts
        run: yarn build

      - name: Run export checks
        run: yarn test:exports

      - name: Run consumer smoke checks
        run: yarn test:consumer

  test-dbx-scale-med:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run DBX scale MED tests
        run: yarn test:dbx:med
